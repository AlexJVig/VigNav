[package]
name = "vignav"
version = "0.3.0"
edition = "2024"
rust-version = "1.98"
description = "Deterministic navigation for RTS games: navmesh, pathfinding and steering."
license = "MIT OR Apache-2.0"
publish = false

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
# A lockstep simulation must not depend on hash iteration order.
iter_over_hash_type = "warn"
